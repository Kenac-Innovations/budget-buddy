<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"></head>
<body>
<div class="pv sb-scope">
 <div class="pv-lbl">shadcn Button</div>
 <div class="pv-row">
  <button class="ui-btn ui-btn-default"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add KPI</button>
  <button class="ui-btn ui-btn-outline">Import Excel</button>
  <button class="ui-btn ui-btn-secondary">Preview and validate</button>
  <button class="ui-btn ui-btn-ghost">Cancel</button>
  <button class="ui-btn ui-btn-destructive"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Discard changes</button>
  <button class="ui-btn ui-btn-link">View audit log</button>
 </div>
 <div class="pv-row">
  <button class="ui-btn ui-btn-default ui-btn-sm">Save</button>
  <button class="ui-btn ui-btn-default ui-btn-lg">Submit self-assessment</button>
  <button class="ui-btn ui-btn-outline ui-btn-icon" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
  <button class="ui-btn ui-btn-default" disabled>Save changes</button>
 </div>
 <div class="pv-lbl">Legacy Btn (.hf-btn)</div>
 <div class="pv-row">
  <button class="hf-btn hf-btn-primary hf-btn-md"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>New task</span></button>
  <button class="hf-btn hf-btn-outline hf-btn-md"><span>Keep editing</span></button>
  <button class="hf-btn hf-btn-ghost hf-btn-md"><span>Close</span></button>
  <button class="hf-btn hf-btn-primary hf-btn-sm"><span>Release</span></button>
 </div>
</div>
</body>
</html>
