<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusPill — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"></head>
<body>
<div class="pv">
 <div class="pv-row">
  <span class="hf-pill hf-pill-md st-on"><span class="hf-dot"></span>On track</span>
  <span class="hf-pill hf-pill-md st-risk"><span class="hf-dot"></span>At risk</span>
  <span class="hf-pill hf-pill-md st-off"><span class="hf-dot"></span>Off track</span>
  <span class="hf-pill hf-pill-md st-none"><span class="hf-dot"></span>No status</span>
  <span class="hf-pill hf-pill-md st-closed"><span class="hf-dot"></span>Closed</span>
 </div>
 <div class="pv-row">
  <span class="hf-pill hf-pill-sm st-on"><span class="hf-dot"></span>On track</span>
  <span class="hf-pill hf-pill-sm st-risk"><span class="hf-dot"></span>At risk</span>
  <span class="hf-pill hf-pill-sm st-off"><span class="hf-dot"></span>Off track</span>
 </div>
</div>
</body>
</html>
