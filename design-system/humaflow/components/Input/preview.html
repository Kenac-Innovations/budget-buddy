<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"></head>
<body>
<div class="pv sb-scope" style="gap:18px">
 <div class="ui-field"><label class="ui-label" for="w">KPI weight (%)</label><input id="w" class="ui-input" value="25"><span class="ui-hint">Weights across all KPIs must total 100%.</span></div>
 <div class="ui-field"><label class="ui-label" for="t">Target</label><input id="t" class="ui-input is-focus" placeholder="e.g. 95% on-shelf availability"></div>
 <div class="ui-field"><label class="ui-label" for="d">Last active date</label><input id="d" class="ui-input" aria-invalid="true" value="2026-01-04"><span class="ui-hint is-error">The last active date cannot be before the assignment starts.</span></div>
</div>
</body>
</html>
