<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"></head>
<body>
<div class="pv" style="max-width:420px;gap:12px">
 <div><div style="font-size:13.5px;font-weight:600;margin-bottom:6px">Grow basket size in Harare stores</div><div class="hf-barwrap"><div class="hf-bar"><div class="hf-bar-fill" style="width:82%;background:var(--green)"></div></div><span class="hf-bar-pct">82%</span></div></div>
 <div><div style="font-size:13.5px;font-weight:600;margin-bottom:6px">Reduce shrinkage to under 1.5%</div><div class="hf-barwrap"><div class="hf-bar"><div class="hf-bar-fill" style="width:46%;background:var(--amber)"></div></div><span class="hf-bar-pct">46%</span></div></div>
 <div><div style="font-size:13.5px;font-weight:600;margin-bottom:6px">Complete food-safety certification</div><div class="hf-barwrap"><div class="hf-bar"><div class="hf-bar-fill" style="width:12%;background:var(--red)"></div></div><span class="hf-bar-pct">12%</span></div></div>
</div>
</body>
</html>
