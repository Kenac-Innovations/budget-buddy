<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Modal — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap"></head>
<body>
<div class="hf-overlay-static" style="min-height:340px"><div class="hf-modal" role="dialog" aria-labelledby="mt">
 <div class="hf-modal-head"><div><h2 id="mt">Submit self-assessment</h2><p class="hf-modal-sub">Your manager will be notified and your scores will be locked.</p></div><button class="hf-modal-x" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
 <div class="hf-modal-body"><label class="hf-field-lbl" for="c">Closing comment</label><p class="hf-field-hint">Optional. Your manager sees this beside your overall score.</p><input id="c" class="hf-input" placeholder="Summarise the quarter in a sentence or two"></div>
 <div class="hf-modal-foot"><button class="hf-btn hf-btn-outline hf-btn-md"><span>Keep editing</span></button><button class="hf-btn hf-btn-primary hf-btn-md"><span>Submit</span></button></div>
</div></div>
</body>
</html>
