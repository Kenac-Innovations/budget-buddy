<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Humaflow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .tint { fill:var(--hf-primary-soft-strong); }
  .slab { fill:var(--hf-primary); }
  .accent { fill:var(--teal); }
  .track { fill:var(--surface); }
  .navy { fill:var(--hf-primary); }
  .green { fill:var(--green); }
  .amber { fill:var(--amber); }
  .red { fill:var(--red); }
  .teal { fill:var(--teal); }
  .tile { rx:var(--r-card); }
  .chip { rx:var(--r-md); }
  .bar { rx:4px; }
  .words { position:absolute; left:var(--screen-pad-left); bottom:30px; max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:800; letter-spacing:-.035em; color:var(--hf-primary-deep); }
  .tag { margin:12px 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      hf-primary slab 96x280 bled off the top and right (the one brand hue, largest) · hf-primary-soft-strong tint 272x208 (the wash) · teal 80x80 once (tenant accent, used sparingly); together about a third of 960x288
  arrangement one tall navy slab with a wide tinted panel and a small accent satellite, bottoms on one line 24px above the edge, 16px gutters
  pattern     KPI progress bars, from the product itself (Bar: 8px r-pill tracks on surface, filled in status colours): seven tracks at a 24px pitch over the tint, fills navy, green, amber, teal and one short red, the way an appraisal list reads
  scales      tile corners r-card (16px), accent corners r-md (11px), bars 8px high at r-pill (rx 4), gutters 16px, left inset screen-pad-left (34px), pitch 24px
-->
<rect class="tint tile" x="16" y="56" width="272" height="208" rx="16"/>
<rect class="accent chip" x="304" y="184" width="80" height="80" rx="11"/>
<rect class="slab tile" x="400" y="-16" width="96" height="280" rx="16"/>
<rect class="track bar" x="40" y="88" width="224" height="8" rx="4"/><rect class="navy bar" x="40" y="88" width="176" height="8" rx="4"/>
<rect class="track bar" x="40" y="112" width="224" height="8" rx="4"/><rect class="green bar" x="40" y="112" width="136" height="8" rx="4"/>
<rect class="track bar" x="40" y="136" width="224" height="8" rx="4"/><rect class="navy bar" x="40" y="136" width="200" height="8" rx="4"/>
<rect class="track bar" x="40" y="160" width="224" height="8" rx="4"/><rect class="amber bar" x="40" y="160" width="88" height="8" rx="4"/>
<rect class="track bar" x="40" y="184" width="224" height="8" rx="4"/><rect class="teal bar" x="40" y="184" width="152" height="8" rx="4"/>
<rect class="track bar" x="40" y="208" width="224" height="8" rx="4"/><rect class="navy bar" x="40" y="208" width="112" height="8" rx="4"/>
<rect class="track bar" x="40" y="232" width="224" height="8" rx="4"/><rect class="red bar" x="40" y="232" width="40" height="8" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Humaflow</h1>
<p class="tag">Performance management for KPAs, KPIs and signed appraisals.</p>
</div>
</div>
</body>
</html>
