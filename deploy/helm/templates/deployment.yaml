apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-buddy
  labels: {app: budget-buddy}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: budget-buddy}
  template:
    metadata:
      labels: {app: budget-buddy}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret | quote }}}
          env:
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: NODE_ENV, value: production}
            - {name: APP_URL, value: {{ printf "https://%s" .Values.host | quote }}}
            - {name: ADVISOR_MODE, value: {{ .Values.advisorMode | quote }}}
          startupProbe:
            httpGet: {path: "/api/health?probe=liveness", port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: "/api/health?probe=liveness", port: http}
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: database-ca, mountPath: /app/certs, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
        - name: database-ca
          secret: {secretName: {{ .Values.databaseCaSecret | quote }}}
