apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: budget-buddy
  namespace: budget-buddy
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts: [budget-buddy.REPLACE_DOMAIN]
      secretName: REPLACE_TLS_SECRET
  rules:
    - host: budget-buddy.REPLACE_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: budget-buddy, port: {name: http}}
